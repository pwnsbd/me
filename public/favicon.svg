<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- paper background -->
  <circle cx="16" cy="16" r="14" fill="#F5F0E8"/>
  <!-- head outline — slightly wobbly circle feel via rx/ry -->
  <ellipse cx="16" cy="16" rx="12.5" ry="12.8"
    fill="none" stroke="#1C1710" stroke-width="1.6" stroke-linecap="round"/>
  <!-- left eye -->
  <path d="M 10.5 13.5 Q 11.5 12.2 12.5 13.5"
    fill="none" stroke="#1C1710" stroke-width="1.4" stroke-linecap="round"/>
  <!-- right eye -->
  <path d="M 19.5 13.5 Q 20.5 12.2 21.5 13.5"
    fill="none" stroke="#1C1710" stroke-width="1.4" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M 11.5 20 Q 16 24 20.5 20"
    fill="none" stroke="#1C1710" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
</svg>
